name: mandub
description: Production-grade accounting and pharmacy management system.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.0
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.7.0
  google_sign_in: ^6.1.5
  intl: ^0.19.0
  uuid: ^4.0.0
  http: ^1.1.0
  dio: ^5.3.1
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  photo_view: ^0.14.0
  pdf: ^3.10.4
  printing: ^5.11.0
  excel: ^2.1.0
  csv: ^5.0.2
  path_provider: ^2.1.1
  permission_handler: ^11.4.4
  device_info_plus: ^9.1.1
  package_info_plus: ^4.1.0
  connectivity_plus: ^5.0.1
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.0.0
  animations: ^2.0.7
  lottie: ^2.6.0
  shimmer: ^3.0.0
  table_calendar: ^3.0.9
  syncfusion_flutter_datepicker: ^23.2.36
  charts_flutter: ^0.12.0
  fl_chart: ^0.63.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  mockito: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  freezed: ^2.4.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600